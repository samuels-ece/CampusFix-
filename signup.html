<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFix - Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <h1>CampusFix</h1>
      <p>Create your account</p>
    </div>

    <form id="signupForm" class="login-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@college.edu" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required />

      <p id="errorMsg" class="error-msg"></p>

      <button type="submit">Sign Up</button>

      <p class="switch-text">
        Already have an account? <a href="index.html">Log in</a>
      </p>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="signup.js"></script>
</body>
</html>
